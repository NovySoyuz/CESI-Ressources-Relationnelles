sonar.projectKey=ressources-relationnelles
sonar.projectName=Ressources Relationnelles
sonar.projectVersion=0.0.1

# Sources analysées : backend Django + frontend Angular
sonar.sources=rr-backend,rr-frontend/front-web/src
sonar.sourceEncoding=UTF-8

# Langages / exclusions (le code de test est déclaré plus bas, pas exclu)
sonar.python.version=3.11
sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/migrations/**,**/*.spec.ts,**/db.sqlite3,rr-frontend/front-mobile/**,**/tests.py

# Code de TEST — analysé avec le profil "tests" (les mots de passe de fixtures
# n'y sont pas traités comme des vulnérabilités).
sonar.tests=rr-backend
sonar.test.inclusions=**/tests.py
