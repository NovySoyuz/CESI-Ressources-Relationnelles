# Reverse-proxy TLS pour la simulation « prod ».
# Termine le HTTPS (cert auto-signé) et transmet à gunicorn en HTTP interne,
# en posant X-Forwarded-Proto=https pour que Django considère la requête sécurisée.

server {
    listen 80;
    server_name localhost;
    # Redirige tout le trafic clair vers HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Ne pas divulguer la version de nginx.
    server_tokens off;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
