# Reverse-proxy TLS « prod-like » qui sert l'app complète sur une seule origine :
#   /       → build Angular statique (SPA)
#   /api/   → gunicorn (Django)
# Le front appelle donc l'API en même origine (pas de CORS, pas de mixed-content).
# server_name _ : accepte localhost ET l'IP LAN.

server {
    listen 80;
    server_name _;
    # Redirige tout le trafic clair vers HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Ne pas divulguer la version de nginx.
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # API Django → gunicorn (X-Forwarded-Proto=https pour que Django voie du HTTPS).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA Angular : toute route inconnue retombe sur index.html (routing client).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
