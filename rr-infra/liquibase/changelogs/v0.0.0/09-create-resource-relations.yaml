databaseChangeLog:
  - changeSet:
      id: 09a-create-resource-relation
      author: team-resources-relationnelles
      comment: "Table de jointure ResourceRelation : Resource possède N Relations"
      changes:
        - createTable:
            tableName: resource_relation
            columns:
              - column:
                  name: resource_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rrel_resource
                    references: resource(resource_id)
              - column:
                  name: relation_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rrel_relation
                    references: relation(relation_id)
        - addPrimaryKey:
            tableName: resource_relation
            columnNames: "resource_id, relation_id"
            constraintName: pk_resource_relation

  - changeSet:
      id: 09b-create-resource-category
      author: team-resources-relationnelles
      comment: "Table de jointure ResourceCategory : Resource possède N Categories"
      changes:
        - createTable:
            tableName: resource_category
            columns:
              - column:
                  name: resource_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rcat_resource
                    references: resource(resource_id)
              - column:
                  name: category_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rcat_category
                    references: category(category_id)
        - addPrimaryKey:
            tableName: resource_category
            columnNames: "resource_id, category_id"
            constraintName: pk_resource_category
