databaseChangeLog:
  - changeSet:
      id: 01-create-user
      author: team-resources-relationnelles
      comment: "Création de la table User (entité parente)"
      changes:
        - createTable:
            tableName: "user"
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_fname
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: user_lname
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: user_mail
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
