databaseChangeLog:
  - changeSet:
      id: 08a-create-resource-reading-sheet
      author: team-resources-relationnelles
      comment: "Sous-type ResourceReadingSheet (fiche de lecture)"
      changes:
        - createTable:
            tableName: resource_reading_sheet
            columns:
              - column:
                  name: resource_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_rrs_resource
                    references: resource(resource_id)
              - column:
                  name: book_title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: book_author
                  type: VARCHAR(255)
              - column:
                  name: summary
                  type: TEXT

  - changeSet:
      id: 08b-create-resource-games
