@if (errorMessage(); as message) {
  <div class="fr-alert fr-alert--error fr-mb-2w">
    <p>{{ message }}</p>
  </div>
}

<div class="fr-input-group" [class.fr-input-group--error]="commentControl.invalid && commentControl.touched">
  <label class="fr-label" for="comment-textarea">Laisser un commentaire</label>
  <textarea
    id="comment-textarea"
    class="fr-input"
    [formControl]="commentControl"
    placeholder="Partagez un retour, une mise en pratique..."
    rows="4"
  ></textarea>
  @if (commentControl.invalid && commentControl.touched) {
    <p class="fr-error-text">Le message est requis et limité à 1200 caractères.</p>
  }
</div>

<div class="form-footer">
  <span class="fr-text--xs fr-text--mention-grey">{{ commentControl.value.length }}/1200</span>
  <button class="fr-btn" type="button" [disabled]="isSubmitting()" (click)="submit()">
    {{ isSubmitting() ? 'Envoi...' : 'Commenter' }}
  </button>
</div>
