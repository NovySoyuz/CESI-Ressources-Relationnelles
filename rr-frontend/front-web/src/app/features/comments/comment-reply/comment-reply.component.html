<div class="reply-box">
  <button
    class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-btn--icon-left fr-icon-chat-3-line"
    type="button"
    (click)="toggleForm()"
  >
    {{ isExpanded() ? 'Annuler' : 'Répondre' }}
  </button>

  @if (isExpanded()) {
    <div class="reply-form">
      @if (errorMessage(); as message) {
        <div class="fr-alert fr-alert--error fr-mb-1w">
          <p>{{ message }}</p>
        </div>
      }

      <div class="fr-input-group" [class.fr-input-group--error]="replyControl.invalid && replyControl.touched">
        <textarea
          class="fr-input"
          [formControl]="replyControl"
          placeholder="Votre réponse..."
          rows="3"
        ></textarea>
        @if (replyControl.invalid && replyControl.touched) {
          <p class="fr-error-text">La réponse est requise et limitée à 800 caractères.</p>
        }
      </div>

      <button class="fr-btn fr-btn--sm" type="button" [disabled]="isSubmitting()" (click)="submit()">
        {{ isSubmitting() ? 'Envoi...' : 'Envoyer' }}
      </button>
    </div>
  }
</div>
