<div class="app-shell">
  <header class="fr-header" role="banner">
    <div class="fr-header__body">
      <div class="fr-container">
        <div class="fr-header__body-row">
          <div class="fr-header__brand fr-enlarge-link">
            <div class="fr-header__brand-top">
              <div class="fr-header__logo">
                <p class="fr-logo">
                  Republique
                  <br />
                  Francaise
                </p>
              </div>
            </div>
            <div class="fr-header__service">
              <a routerLink="/dashboard/progression" title="Accueil Marianne">
                <p class="fr-header__service-title">{{ title }}</p>
              </a>
              <p class="fr-header__service-tagline">{{ serviceTagline }}</p>
            </div>
          </div>

          <div class="fr-header__tools">
            <div class="fr-header__tools-links">
              <ul class="app-shell__nav" aria-label="Navigation principale">
                @for (item of navigation; track item.link) {
                  <li>
                    <a
                      class="fr-btn fr-btn--tertiary-no-outline app-shell__nav-link"
                      [routerLink]="item.link"
                      routerLinkActive="app-shell__nav-link--active"
                      [routerLinkActiveOptions]="{ exact: true }"
                    >
                      {{ item.label }}
                    </a>
                  </li>
                }
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="content" class="fr-container fr-py-6w app-shell__main">
    <router-outlet></router-outlet>
  </main>
</div>
