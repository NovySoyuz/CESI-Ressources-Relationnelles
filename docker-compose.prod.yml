# Override « prod-like » — à combiner avec docker-compose-root.yml :
#   docker compose -f docker-compose-root.yml -f docker-compose.prod.yml up -d --build backend nginx
# (ou `make prod`).
#
# Différences avec le dev :
#   - backend servi par gunicorn (plus runserver)
#   - DEBUG=False, DJANGO_ENV=production, ALLOWED_HOSTS restreint (+ IP LAN)
#   - nginx sert l'app complète : build Angular sur /, proxy /api/ vers gunicorn,
#     termine le TLS. Front et API sur la même origine.
#   - le cert auto-signé est généré DANS le conteneur nginx au démarrage
#     (script docker-entrypoint.d, SAN = localhost + IP LAN), persisté en volume.
services:

  backend:
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      - DJANGO_ENV=production
      - DEBUG=False
      # ${HOST_IP} est fourni par `make prod` (fallback 127.0.0.1 si lancé à la main).
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,nginx,${HOST_IP:-127.0.0.1}

  nginx:
    build:
      context: .
      dockerfile: rr-infra/nginx/Dockerfile
    container_name: rr_nginx
    depends_on:
      - backend
    environment:
      # Injectée dans le SAN du cert auto-signé (fallback 127.0.0.1 si lancé à la main).
      - HOST_IP=${HOST_IP:-127.0.0.1}
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - nginx_certs:/etc/nginx/certs
    networks:
      - rr_network

volumes:
  nginx_certs:
    name: rr_nginx_certs
